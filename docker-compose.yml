services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: famousmobiles
      POSTGRES_USER: ${DB_USER:-famousmobiles}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-famousmobiles}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-famousmobiles}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/famousmobiles
      DB_USER: ${DB_USER:-famousmobiles}
      DB_PASSWORD: ${DB_PASSWORD:-famousmobiles}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      UPLOAD_DIR: /data/uploads
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:-http://localhost}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@famousmobiles.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@123}
      ADMIN_MOBILE: ${ADMIN_MOBILE:-9000000000}
      ADMIN_SYNC_ON_START: ${ADMIN_SYNC_ON_START:-false}
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost/api}
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend

volumes:
  pgdata:
