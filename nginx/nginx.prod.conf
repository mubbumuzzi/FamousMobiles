events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Docker embedded DNS — resolve upstreams at request time, not nginx startup
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Redirect HTTP to HTTPS (uncomment after SSL certs are installed)
    # server {
    #     listen 80;
    #     server_name app.famousmobiles.com;
    #     location /.well-known/acme-challenge/ {
    #         root /var/www/certbot;
    #     }
    #     location / {
    #         return 301 https://$host$request_uri;
    #     }
    # }

    server {
        listen 80;
        # listen 443 ssl;   # Uncomment after SSL setup
        # ssl_certificate /etc/letsencrypt/live/app.famousmobiles.com/fullchain.pem;
        # ssl_certificate_key /etc/letsencrypt/live/app.famousmobiles.com/privkey.pem;

        client_max_body_size 15M;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location /api/ {
            set $backend_upstream backend:8080;
            proxy_pass http://$backend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            set $frontend_upstream frontend:3000;
            proxy_pass http://$frontend_upstream;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
